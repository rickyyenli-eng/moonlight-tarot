<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牌義知識庫 · Moonlight Tarot 月光塔羅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
<link rel="stylesheet" href="tarot.css">
<style>
.lang-switch { position: absolute; top: 14px; right: 14px; display: flex; gap: 4px; }
.lang-switch button { border: 1px solid var(--border); background: var(--bg-card); color: var(--text-soft);
  font-size: 11.5px; font-family: inherit; padding: 4px 9px; border-radius: 99px; cursor: pointer; }
.lang-switch button.on { background: var(--mystic1); color: #f0e9db; border-color: var(--mystic1); }
.container { position: relative; }
.lib-card {
  background: #fffdf8; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 16px; margin-bottom: 10px;
}
.lib-card { display: flex; gap: 14px; }
.lib-card .thumb { flex: 0 0 74px; }
.lib-card .thumb img { width: 74px; border-radius: 6px; border: 1px solid var(--border-strong); display: block; }
.lib-card .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lib-card .emoji { font-size: 22px; }
.lib-card .zh { font-size: 16.5px; font-weight: 600; }
.lib-card .en { font-size: 12px; color: var(--text-soft); }
.lib-card .suit-tag {
  margin-left: auto; font-size: 11px; color: var(--accent);
  border: 1px solid var(--accent-soft); border-radius: 99px; padding: 1px 9px;
}
.lib-card .m-row { display: flex; gap: 8px; margin-top: 8px; font-size: 13.5px; }
.lib-card .m-tag { flex: 0 0 auto; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; height: fit-content; margin-top: 2px; }
.lib-card .m-tag.up { background: #e4efe9; color: var(--success); }
.lib-card .m-tag.rev { background: #f6e3e5; color: var(--danger); }
#emptyMsg { text-align: center; color: var(--text-soft); padding: 30px 0; display: none; }
.count-note { font-size: 12px; color: var(--text-soft); margin: 4px 0 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="lang-switch">
    <button data-l="zh">中</button><button data-l="en">EN</button><button data-l="ja">日</button>
  </div>
  <header class="site-header">
    <h1 data-t="lib_title"></h1>
    <div class="subtitle" data-t="lib_sub"></div>
  </header>
  <nav class="top-nav">
    <a href="index.html" data-t="nav_draw"></a>
    <a href="library.html" class="active" data-t="nav_lib"></a>
  </nav>

  <section class="card-panel">
    <input type="text" id="searchBox" data-tph="lib_search">
    <div style="margin-top:10px;" id="suitChips"></div>
    <div class="count-note" id="countNote"></div>
    <div id="libList"></div>
    <div id="emptyMsg" data-t="lib_empty"></div>
  </section>

  <div class="footer-note">
    <span data-t="foot_mirror"></span><br>
    <span style="font-size:10.5px;"><span data-th="foot_credit"></span><br><span data-t="foot_disc"></span></span><br>
    Moonlight Tarot · <a href="studio.html" title="studio">🗝️</a>
  </div>
</div>

<script src="i18n.js"></script>
<script src="tarot-core.js"></script>
<script>
const $ = id => document.getElementById(id);
const SUITS_ZH = ['全部', '大阿爾克那', '權杖', '聖杯', '寶劍', '錢幣'];
function suitLabel(zh) {
  if (zh === '全部') return t('lib_all');
  if (LANG !== 'zh' && I18N_SUITS[LANG] && I18N_SUITS[LANG][zh]) return I18N_SUITS[LANG][zh];
  return zh;
}
let curSuit = '全部', curQ = '';
function applyI18n() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-th]').forEach(el => { el.innerHTML = t(el.dataset.th); });
  document.querySelectorAll('[data-tph]').forEach(el => { el.placeholder = t(el.dataset.tph); });
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hant' : LANG;
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
}
document.querySelectorAll('.lang-switch button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));

function renderChips() {
  $('suitChips').innerHTML = SUITS_ZH.map(s => `<span class="chip ${s === curSuit ? 'active' : ''}" data-s="${s}">${suitLabel(s)}</span>`).join('');
  document.querySelectorAll('#suitChips .chip').forEach(ch => ch.addEventListener('click', () => {
    curSuit = ch.dataset.s; applyI18n(); renderChips(); renderList();
  }));
}
function renderList() {
  const list = TAROT_CARDS.filter(c => {
    if (curSuit !== '全部' && suitZh_(c) !== curSuit) return false;
    if (!curQ) return true;
    return (c.name + c.up + c.rev + cardZhName(c) + meaningOf(c, true) + meaningOf(c, false)).toLowerCase().includes(curQ.toLowerCase());
  });
  $('countNote').textContent = t('lib_count', { n: list.length });
  $('emptyMsg').style.display = list.length ? 'none' : 'block';
  $('libList').innerHTML = list.map(c => `
    <div class="lib-card">
      <div class="thumb"><img src="${cardImg(c.n)}" alt="${cardZhName(c)}" loading="lazy"></div>
      <div style="flex:1;">
      <div class="head">
        <span class="emoji">${c.emoji}</span>
        <span class="zh">${cardZhName(c)}</span>
        <span class="en">${LANG === 'zh' ? c.name.slice(c.name.split(' ')[0].length).trim() : ''}</span>
        <span class="suit-tag">${suitOf(c)}</span>
      </div>
      <div class="m-row"><span class="m-tag up">${t('upright')}</span><span>${meaningOf(c, true)}</span></div>
      <div class="m-row"><span class="m-tag rev">${t('reversed')}</span><span>${meaningOf(c, false)}</span></div>
      </div>
    </div>`).join('');
}
$('searchBox').addEventListener('input', e => { curQ = e.target.value.trim(); renderList(); });
applyI18n(); renderChips(); renderList();
</script>
</body>
</html>
