<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Moonlight Tarot 月光塔羅 · 線上抽牌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
<link rel="stylesheet" href="tarot.css">
<style>
/* ===== 抽牌頁專屬 ===== */
.spread-opt {
  display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 13px 14px; margin-bottom: 9px; transition: all .2s; background: #fffdf8;
}
.spread-opt:hover { border-color: var(--accent); }
.spread-opt.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 2px 10px rgba(200,149,109,.2); }
.spread-opt .s-emoji { font-size: 24px; line-height: 1.2; }
.spread-opt .s-name { font-weight: 600; font-size: 14.5px; }
.spread-opt .s-desc { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }
/* 選填細節：預設完全看不到，點了才展開 */
.detail-box { display: none; margin-top: 10px; padding: 13px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
.detail-box.show { display: block; }
.detail-box input { margin-bottom: 8px; background: #fff; }
.detail-box input:last-child { margin-bottom: 0; }
.tpl-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; min-height: 20px; }
.tpl-ok { color: var(--success); font-weight: 500; }
.more-link { color: var(--text-soft); cursor: pointer; user-select: none; border-bottom: 1px dotted var(--text-soft); }
.more-link:hover { color: var(--accent); border-color: var(--accent); }
#questionInput { min-height: 62px; }

/* ===== 儀式區 ===== */
#ritualSection { display: none; }
.ritual-stage {
  background: radial-gradient(ellipse at 50% 30%, var(--mystic2) 0%, var(--mystic1) 75%);
  border-radius: 16px; padding: 26px 12px 22px; text-align: center; overflow: hidden;
  position: relative; box-shadow: 0 8px 30px rgba(43,35,64,.35);
}
.ritual-hint { color: #cbbfe3; font-size: 13.5px; margin-bottom: 16px; letter-spacing: .5px; }
.ritual-hint b { color: var(--gold); }
/* 洗牌動畫 */
#shuffleAnim { height: 170px; position: relative; }
.sh-card {
  position: absolute; left: 50%; top: 50%; width: 74px; height: 118px; margin: -59px 0 0 -37px;
  border-radius: 8px; animation: shuffle 1.5s ease-in-out infinite;
}
@keyframes shuffle {
  0%   { transform: translate(0,0) rotate(0deg); }
  25%  { transform: translate(calc(var(--dx) * 1px), calc(var(--dy) * 1px)) rotate(calc(var(--rot) * 1deg)); }
  50%  { transform: translate(calc(var(--dx) * -0.6px), calc(var(--dy) * -0.8px)) rotate(calc(var(--rot) * -0.7deg)); }
  75%  { transform: translate(calc(var(--dx) * 0.3px), calc(var(--dy) * 0.5px)) rotate(calc(var(--rot) * 0.4deg)); }
  100% { transform: translate(0,0) rotate(0deg); }
}
.card-back-face {
  background-image: radial-gradient(circle at 50% 42%, rgba(212,175,106,.18) 0%, transparent 55%),
                    linear-gradient(150deg, #3a2f56 0%, #2b2340 55%, #241d38 100%);
  border: 1.5px solid #6a5a92; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--gold); box-shadow: 0 4px 14px rgba(0,0,0,.35);
}
/* 扇形選牌 */
#fanWrap { display: none; }
#fanScroller { overflow-x: auto; padding: 26px 18px 14px; -webkit-overflow-scrolling: touch; }
#fanRow { display: flex; width: max-content; padding: 0 10px; }
.fan-card {
  width: 54px; height: 88px; margin-left: -24px; flex: 0 0 auto;
  border-radius: 6px; cursor: pointer; position: relative;
  transition: transform .18s, box-shadow .18s; font-size: 13px;
  align-items: flex-start; justify-content: flex-start; padding: 5px 0 0 7px;
  border-color: #8672b5; box-shadow: -3px 0 8px rgba(0,0,0,.35);
  transform: translateY(calc(var(--arc) * 1px)) rotate(calc(var(--tilt) * 1deg));
}
.fan-card:first-child { margin-left: 0; }
.fan-card.picked {
  transform: translateY(calc(var(--arc) * 1px - 22px)) rotate(0deg); z-index: 5;
  box-shadow: 0 0 0 2px var(--gold), 0 10px 18px rgba(0,0,0,.45);
}
.fan-card .pick-no {
  display: none; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  background: var(--gold); color: #2b2340; font-size: 11px; font-weight: 700;
  width: 20px; height: 20px; border-radius: 50%; line-height: 20px; text-align: center;
}
.fan-card.picked .pick-no { display: block; }
.hint-desktop { display: none; }
/* 桌機／平板：把 78 張全部攤開成多排，不用左右滑 */
@media (min-width: 760px) {
  .hint-mobile { display: none; }
  .hint-desktop { display: inline; }
  #fanScroller { overflow-x: visible; padding: 20px 14px 12px; }
  #fanRow {
    /* 43×13 + 6×12 = 631 → 剛好每排 13 張，78 張排成整齊的 6 排 */
    flex-wrap: wrap; width: auto; max-width: 631px; margin: 0 auto;
    justify-content: flex-start; gap: 6px; padding: 0;
  }
  .fan-card {
    width: 43px; height: 70px; margin-left: 0; font-size: 10px;
    padding: 4px 0 0 5px;
    transform: none; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .fan-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 0 0 1px var(--gold), 0 8px 16px rgba(0,0,0,.45);
  }
  .fan-card.picked { transform: translateY(-9px); }
  .fan-card .pick-no { top: -8px; width: 18px; height: 18px; line-height: 18px; font-size: 10px; }
}
/* 翻牌 */
#revealWrap { display: none; }
#revealRow { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding: 8px 0 4px; }
.flip-card { width: 96px; height: 160px; perspective: 900px; }
.flip-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.4,.1,.2,1); }
.flip-card.flipped .flip-inner { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; }
.flip-front { transform: rotateY(180deg); background: #1c1631; border: 1.5px solid var(--gold); overflow: hidden; }
.flip-front img { width: 100%; height: 100%; object-fit: cover; display: block; }
.flip-front.rev img { transform: rotate(180deg); }
.flip-front .f-tag {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 4px 4px;
  background: linear-gradient(transparent, rgba(20,14,40,.92) 40%);
  color: #f0e9db; font-size: 10.5px; line-height: 1.3; text-align: center;
}
.flip-front .f-tag .o-up { color: #9fd8b7; }
.flip-front .f-tag .o-rev { color: #f0a8b0; }
/* 結果 */
#resultSection { display: none; }
.result-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.result-actions .btn { flex: 1 1 140px; }
.reading-card { display: flex; gap: 14px; align-items: flex-start; }
.reading-card .r-img { flex: 0 0 88px; }
.reading-card .r-img img { width: 88px; border-radius: 8px; border: 1px solid var(--border-strong); display: block; box-shadow: var(--shadow-sm); }
.reading-card .r-img.rev img { transform: rotate(180deg); }
.synth-head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
.verdict { font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 99px; }
.verdict.pos { background: #d8ecdf; color: #23603f; }
.verdict.neu { background: #ece3d2; color: #7a6444; }
.verdict.neg { background: #f6dfe1; color: #8d2430; }
.advice-line {
  margin-top: 11px; padding: 11px 13px; background: rgba(255,253,248,.72);
  border-left: 3px solid var(--accent); border-radius: 8px;
  font-size: 13.5px; line-height: 1.7; color: #5c4a33;
}
/* 神諭卡 */
/* AI 深入解讀：成功才出現，失敗完全隱形 */
.deep-box { display: none; margin-top: 14px; border-radius: 12px; padding: 18px 16px;
  background: linear-gradient(135deg, #f7f1e6 0%, #efe4d2 100%); border: 1px solid var(--accent-soft); }
.deep-box.show { display: block; }
.deep-head { font-size: 12px; letter-spacing: 2px; color: #8a6e4e; margin-bottom: 10px; }
.deep-body { font-size: 14px; line-height: 1.95; color: #4a3a28; white-space: pre-wrap; }
.deep-loading { display: none; margin-top: 14px; text-align: center; font-size: 12.5px; color: var(--text-soft); }
.deep-loading.show { display: block; }
.deep-loading .dots::after { content: '…'; animation: dots 1.4s steps(4,end) infinite; }
@keyframes dots { 0%{content:''} 25%{content:'·'} 50%{content:'··'} 75%{content:'···'} }
.oracle-box { margin-top: 14px; }
.oracle-invite {
  text-align: center; background: #fffdf8; border: 1px dashed var(--accent);
  border-radius: 12px; padding: 16px 14px;
}
.oracle-invite .o-q { font-size: 13.5px; color: var(--text-muted); margin-bottom: 11px; line-height: 1.6; }
.oracle-invite .o-note { font-size: 11px; color: var(--text-soft); margin-top: 9px; }
.oracle-card {
  display: none; text-align: center; border-radius: 14px; padding: 24px 18px;
  background: radial-gradient(ellipse at 50% 20%, #4a3868 0%, #2b2340 80%);
  box-shadow: 0 8px 26px rgba(43,35,64,.32);
  animation: oracleIn .7s cubic-bezier(.2,.9,.3,1.2);
}
.oracle-card.show { display: block; }
@keyframes oracleIn {
  0%   { opacity: 0; transform: scale(.82) translateY(14px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.oracle-card .o-label { font-size: 11px; letter-spacing: 3px; color: #b9a8d6; margin-bottom: 16px; }
.o-item { display: flex; gap: 14px; text-align: left; padding: 14px 2px; align-items: flex-start; }
.o-item + .o-item { border-top: 1px solid rgba(185,168,214,.22); }
.o-item .oi-img { flex: 0 0 68px; }
.o-item .oi-img img {
  width: 68px; display: block; border-radius: 5px;
  border: 1px solid var(--gold); box-shadow: 0 3px 10px rgba(0,0,0,.4);
}
.o-item .oi-title {
  font-family: 'Fraunces', Georgia, serif; font-size: 17px; color: var(--gold);
  letter-spacing: .5px; margin-bottom: 2px;
}
.o-item .oi-de { font-size: 10.5px; color: #9d8fc0; letter-spacing: .5px; margin-bottom: 6px; }
.o-item .oi-msg { font-size: 13.5px; color: #ede6d8; line-height: 1.75; }
.oracle-credit { font-size: 10.5px; color: #9d8fc0; line-height: 1.6; margin-top: 14px;
  padding-top: 12px; border-top: 1px solid rgba(185,168,214,.22); text-align: center; }
.send-nudge {
  margin-top: 14px; text-align: center; font-size: 13px; color: var(--text-muted);
  background: #fffdf8; border: 1px dashed var(--accent); border-radius: 10px; padding: 12px;
}
/* 贊助區：低調、不擋路 */
.tip-box {
  display: none; margin-top: 16px; text-align: center;
  background: linear-gradient(135deg, #f5ede0 0%, #ebd9c2 100%);
  border-radius: 12px; padding: 18px 16px;
}
.tip-box.show { display: block; }
.tip-box .tip-msg { font-size: 13px; color: #6b5b45; margin-bottom: 11px; line-height: 1.6; }
.tip-box a.tip-btn {
  display: inline-block; text-decoration: none;
  background: #2b2340; color: #f0e9db; font-size: 13.5px; font-weight: 500;
  padding: 10px 22px; border-radius: 99px; transition: all .2s;
}
.tip-box a.tip-btn:hover { background: #4a3868; }
.tip-box .tip-note { font-size: 11px; color: #9a8a70; margin-top: 9px; }
</style>
</head>
<body>
<div class="container">
  <div class="lang-switch">
    <button data-l="zh">中</button><button data-l="en">EN</button><button data-l="ja">日</button>
  </div>
  <header class="site-header">
    <h1>🌙 Moonlight Tarot</h1>
    <div class="subtitle" data-t="site_sub"></div>
  </header>
  <nav class="top-nav">
    <a href="index.html" class="active" data-t="nav_draw"></a>
    <a href="library.html" data-t="nav_lib"></a>

  <!-- STEP 1 牌陣 -->
  <section class="card-panel setup-panel" id="spreadPanel">

    <div class="text-soft" style="margin-bottom:12px;" data-t="step1_sub"></div>

  <!-- STEP 2 問題 -->
  <section class="card-panel setup-panel">
    <div class="panel-title" data-t="step2"></div>
    <div class="text-soft" style="margin-bottom:12px;" data-t="step2_sub"></div>
    <div id="tplChips"></div>
    <div class="text-soft" style="margin:14px 0 5px;" data-t="your_q"></div>
    <textarea id="questionInput" data-tph="q_ph"></textarea>
    <div class="tpl-status" id="tplStatus"></div>
    <div class="detail-box" id="detailBox">
      <div class="text-soft" style="margin-bottom:8px;" data-th="detail_hint"></div>
      <div id="blankInputs"></div>
    </div>
    <button class="btn gold big" id="startBtn" style="margin-top:16px;" data-t="start"></button>
  </section>

  <!-- 儀式 -->
  <section id="ritualSection">
    <div class="ritual-stage">
      <div class="ritual-hint" id="ritualHint">牌正在洗勻，深呼吸，心裡默想你的問題…</div>
      <div id="shuffleAnim"></div>
      <div id="fanWrap">
        <div id="fanScroller"><div id="fanRow"></div></div>
        <div class="text-soft fan-hint" style="color:#9d8fc0; font-size:11.5px;">
          <span class="hint-mobile" data-t="hint_mobile"></span>
          <span class="hint-desktop" data-t="hint_desktop"></span>
        </div>
        <button class="btn gold" id="flipBtn" style="margin-top:14px;" disabled data-t="flip"></button>
      </div>
      <div id="revealWrap">
        <div id="revealRow"></div>
        <button class="btn gold" id="showResultBtn" style="margin-top:12px; display:none;" data-t="see_full"></button>
      </div>

  </section>

  <!-- 結果 -->
  <section id="resultSection">
    <div class="card-panel">
      <div class="panel-title" id="resultTitle" data-t="your_cards"></div>
      <div class="text-soft" id="resultMeta" style="margin-bottom:12px;"></div>
      <div id="resultCards"></div>
      <div class="synth-box">
        <div class="synth-head">
          <span style="font-size:12px; letter-spacing:2px; color:#8a6e4e;" data-t="synth"></span>
          <span class="verdict" id="verdictTag"></span>
        </div>
        <div id="synthText" style="font-size:14.5px; line-height:1.75;"></div>
        <div class="advice-line" id="adviceText"></div>
        <div style="font-size:11.5px; color:#9a8a70; margin-top:10px;" data-t="synth_note"></div>
      </div>
      <div class="deep-loading" id="deepLoading"><span class="dots" data-t="deep_loading"></span></div>
      <div class="deep-box" id="deepBox">
        <div class="deep-head" data-t="deep_head"></div>
        <div class="deep-body" id="deepBody"></div>
      </div>

      <div class="oracle-box" id="oracleBox">
        <div class="oracle-invite" id="oracleInvite">
          <div class="o-q" id="oracleQ"></div>
          <button class="btn gold" id="oracleBtn" data-t="oracle_btn"></button>
          <div class="o-note" data-t="oracle_note"></div>
        </div>
        <div class="oracle-card" id="oracleCard">
          <div class="o-label" data-t="oracle_head"></div>
          <div id="oracleList"></div>
          <div class="oracle-credit" data-th="oracle_credit"></div>

      <div class="result-actions">

      <div class="result-actions" style="margin-top:8px;">
        <button class="btn secondary" id="againBtn" data-t="again"></button>

        <div class="tip-msg" id="tipMsg"></div>
        <a class="tip-btn" id="tipBtn" href="#" target="_blank" rel="noopener" data-t="tip_btn"></a>

  <div class="footer-note">

    <span style="font-size:10.5px;"><span data-t="foot_privacy"></span><br><span data-th="foot_credit"></span><br><span data-t="foot_disc"></span></span><br>

<div class="toast" id="toast"></div>
<canvas id="shareCanvas" style="display:none;"></canvas>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="tarot-core.js"></script>
<script>
// ===== 狀態 =====
let curSpread = 'triangle';
let curDraws = [];      // [{card, upright}]
let pickedIdx = [];     // 扇形中被點選的順序
const $ = id => document.getElementById(id);

function showToast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(el._tm); el._tm = setTimeout(() => el.classList.remove('show'), 2400);
}

// ===== 牌陣選擇 =====
function renderSpreads() {
  $('spreadList').innerHTML = Object.values(SPREADS).map(s => `
    <div class="spread-opt ${s.id === curSpread ? 'active' : ''}" data-id="${s.id}">
      <div class="s-emoji">${s.emoji}</div>
      <div><div class="s-name">${s.name} · ${t('cards_n', { n: s.count })}</div><div class="s-desc">${s.desc}</div></div>
    </div>`).join('');
  document.querySelectorAll('.spread-opt').forEach(el => el.addEventListener('click', () => onPickSpread(el.dataset.id)));
}

function onPickSpread(id) {
  if (id === curSpread) return;
  curSpread = id;
  const box = $('questionInput');
  const autoFilled = (box.value === '' || box.value === lastAutoQuestion);

  // 換牌陣之後，原本的主題如果不再適用就清掉
  if (activeTpl && !templateFitsSpread(activeTpl)) {
    if (autoFilled) { box.value = ''; lastAutoQuestion = ''; }
    activeTpl = null;
    detailOpen = false;
    $('blankInputs').innerHTML = '';
  }
  renderSpreads();
  renderTemplates();
  // 二擇一底下只有一個主題，直接幫他選好
  if (curSpread === 'choice' && !activeTpl && autoFilled) {
    const only = getTemplates().findIndex(x => x.spread === 'choice');
    if (only >= 0) selectTemplate(only);
  }
  updateStatus();
}

// ===== 問題模板 =====
// 原則：點一下主題就完成了。細節欄預設看不到，想補充才自己展開。
let lastAutoQuestion = '';
let activeTpl = null;
let detailOpen = false;

// 二擇一牌陣只配二擇一主題；其他牌陣則不出現二擇一
function templateFitsSpread(tpl) {
  return curSpread === 'choice' ? tpl.spread === 'choice' : tpl.spread !== 'choice';
}

function applyTemplate(vals) {
  if (!activeTpl) return;
  const q = activeTpl.make(vals);
  const box = $('questionInput');
  if (box.value === '' || box.value === lastAutoQuestion) {   // 使用者手動改過就不覆蓋
    box.value = q;
    lastAutoQuestion = q;
  }
  updateStatus();
}

function hasDetails() {
  return !!(activeTpl && activeTpl.blanks.length > 0);
}

function updateStatus() {
  const filled = $('questionInput').value.trim().length > 0;
  const parts = [];
  if (filled) parts.push('<span class="tpl-ok">' + t('q_ok') + '</span>');
  if (hasDetails()) {
    parts.push(`<span class="more-link" id="moreLink">${detailOpen ? t('more_close') : t('more_open')}</span>`);
  } else {
    detailOpen = false;
  }
  $('tplStatus').innerHTML = parts.join('');
  $('detailBox').classList.toggle('show', detailOpen && hasDetails());
  const ml = $('moreLink');
  if (ml) ml.addEventListener('click', () => { detailOpen = !detailOpen; updateStatus(); });
}

function selectTemplate(idx) {
  const tpl = getTemplates()[idx];
  if (!tpl) return;
  activeTpl = tpl;
  detailOpen = false;

  if (tpl.spread && tpl.spread !== curSpread) { curSpread = tpl.spread; renderSpreads(); renderTemplates(); }

  document.querySelectorAll('#tplChips .chip').forEach(c =>
    c.classList.toggle('active', +c.dataset.i === idx));

  const bi = $('blankInputs');
  bi.innerHTML = tpl.blanks.map((b, j) => `<input type="text" id="blank${j}" placeholder="${b}">`).join('');
  tpl.blanks.forEach((b, j) => {
    $('blank' + j).addEventListener('input', () => {
      applyTemplate(tpl.blanks.map((_, k) => $('blank' + k).value.trim()));
    });
  });

  applyTemplate(tpl.blanks.map(() => ''));
}

function renderTemplates() {
  const list = getTemplates().map((tp, i) => ({ t: tp, i })).filter(x => templateFitsSpread(x.t));
  $('tplChips').innerHTML = list.map(({ t: tp, i }) =>
    `<span class="chip ${activeTpl === tp ? 'active' : ''}" data-i="${i}">${tp.label}</span>`).join('');
  document.querySelectorAll('#tplChips .chip').forEach(ch =>
    ch.addEventListener('click', () => selectTemplate(+ch.dataset.i)));
}
$('questionInput').addEventListener('input', updateStatus);

// ===== 開始儀式 =====
$('startBtn').addEventListener('click', () => {
  document.querySelectorAll('.setup-panel').forEach(p => p.style.display = 'none');
  $('resultSection').style.display = 'none';
  $('ritualSection').style.display = 'block';
  $('fanWrap').style.display = 'none';
  $('revealWrap').style.display = 'none';
  $('shuffleAnim').style.display = 'block';
  $('ritualHint').textContent = t('shuffling');
  // 洗牌動畫
  const anim = $('shuffleAnim'); anim.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const c = document.createElement('div');
    c.className = 'sh-card card-back-face';
    c.textContent = '✦';
    c.style.setProperty('--dx', (Math.random() * 120 - 60).toFixed(0));
    c.style.setProperty('--dy', (Math.random() * 60 - 30).toFixed(0));
    c.style.setProperty('--rot', (Math.random() * 40 - 20).toFixed(0));
    c.style.animationDelay = (i * 0.06) + 's';
    anim.appendChild(c);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(showFan, 2300);
});

// ===== 扇形選牌 =====
function showFan() {
  const need = SPREADS[curSpread].count;
  pickedIdx = [];
  $('shuffleAnim').style.display = 'none';
  $('fanWrap').style.display = 'block';
  $('ritualHint').innerHTML = t('pick_n', { n: need });
  const row = $('fanRow'); row.innerHTML = '';
  for (let i = 0; i < 78; i++) {
    const d = document.createElement('div');
    d.className = 'fan-card card-back-face';
    d.textContent = '✦';
    const p = (i - 38.5) / 38.5;                 // -1 ~ 1
    d.style.setProperty('--arc', (p * p * 26).toFixed(1)); // 弧形
    d.style.setProperty('--tilt', (p * 7).toFixed(2));
    d.innerHTML = '✦<span class="pick-no"></span>';
    d.addEventListener('click', () => {
      const at = pickedIdx.indexOf(i);
      if (at >= 0) { pickedIdx.splice(at, 1); d.classList.remove('picked'); }
      else if (pickedIdx.length < need) { pickedIdx.push(i); d.classList.add('picked'); }
      // 更新編號
      document.querySelectorAll('.fan-card').forEach((el, k) => {
        const p = pickedIdx.indexOf(k);
        el.querySelector('.pick-no').textContent = p >= 0 ? p + 1 : '';
      });
      const left = need - pickedIdx.length;
      const nc = document.getElementById('needCount'); if (nc) nc.textContent = left;
      $('flipBtn').disabled = left !== 0;
      if (left === 0) $('ritualHint').textContent = t('pick_done');
    });
    row.appendChild(d);
  }
  // 捲到中間
  requestAnimationFrame(() => { const sc = $('fanScroller'); sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) / 2; });
}

// ===== 翻牌 =====
$('flipBtn').addEventListener('click', () => {
  const spread = SPREADS[curSpread];
  curDraws = drawCards(spread.count);
  $('fanWrap').style.display = 'none';
  $('revealWrap').style.display = 'block';
  $('ritualHint').textContent = t('flipping');
  const row = $('revealRow'); row.innerHTML = '';
  curDraws.forEach((d, i) => {
    const zh = cardZhName(d.card);
    const el = document.createElement('div');
    el.className = 'flip-card';
    el.innerHTML = `
      <div class="flip-inner">
        <div class="flip-face card-back-face" style="font-size:22px;">✦</div>
        <div class="flip-face flip-front ${d.upright ? '' : 'rev'}">
          <img src="${cardImg(d.card.n)}" alt="${zh}">
          <div class="f-tag">${spread.positions[i]}・${zh}<br><span class="${d.upright ? 'o-up' : 'o-rev'}">${d.upright ? t('upright') : t('reversed')}</span></div>
        </div>
      </div>`;
    row.appendChild(el);
    setTimeout(() => el.classList.add('flipped'), 500 + i * 650);
  });
  setTimeout(() => { $('showResultBtn').style.display = 'inline-flex'; }, 500 + curDraws.length * 650 + 400);
});

// ===== 結果 =====
$('showResultBtn').addEventListener('click', showResult);
function fullQuestion() {
  return $('questionInput').value.trim();
}
function showResult() {
  const spread = SPREADS[curSpread];
  $('ritualSection').style.display = 'none';
  $('resultSection').style.display = 'block';
  $('resultMeta').textContent = `${spread.name} · ${nowStr()}` + (fullQuestion() ? ` · ${fullQuestion()}` : '');
  $('resultCards').innerHTML = curDraws.map((d, i) => `
    <div class="reading-card">
      <div class="r-img ${d.upright ? '' : 'rev'}"><img src="${cardImg(d.card.n)}" alt="${cardZhName(d.card)}"></div>
      <div>
        <div class="pos-label">${spread.positions[i].toUpperCase()} · ${spread.roles[i]}</div>
        <div class="card-name">${cardZhName(d.card)}
          <span class="orient ${d.upright ? 'up' : 'rev'}">${d.upright ? t('upright') : t('reversed')}</span></div>
        <div class="kw">${t('keywords')}：${keywordsOf(d.card, d.upright)}</div>
        <div class="meaning">${meaningOf(d.card, d.upright)}</div>
      </div>
    </div>`).join('');
  const sum = shortSummary(curSpread, curDraws, fullQuestion());
  $('verdictTag').textContent = sum.label;
  $('verdictTag').className = 'verdict ' + sum.tone;
  $('synthText').textContent = sum.text;
  $('adviceText').innerHTML = '💡 <b>' + t('advice') + '</b>　' + sum.advice;
  resetOracle(sum.tone);
  myReads = readCount();
  $('deepBox').classList.remove('show');
  $('deepBody').textContent = '';
  scheduleLog();
  fetchDeepReading(sum);
  renderTip();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function nowStr() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ===== AI 完整解讀 =====
// 成功就多出一塊；額度用完、出錯、太慢，一律安靜收掉，訪客看不到任何錯誤訊息。
function buildVisitorPrompt(sum) {
  const spread = SPREADS[curSpread];
  const cards = curDraws.map((d, i) =>
    (i + 1) + '. ' + spread.positions[i] + ' (' + spread.roles[i] + ') — '
    + cardZhName(d.card) + ' ' + (d.upright ? t('upright') : t('reversed')) + '\n   '
    + meaningOf(d.card, d.upright)).join('\n');

  if (LANG !== 'zh' && typeof I18N_AI_PROMPT !== 'undefined' && I18N_AI_PROMPT[LANG]) {
    return I18N_AI_PROMPT[LANG]
      .split('{q}').join(fullQuestion() || '—')
      .split('{s}').join(spread.name + ' — ' + spread.desc)
      .split('{cards}').join(cards)
      .split('{v}').join(sum.label + '　' + sum.text);
  }
  const L = [];
  L.push('你是一位溫暖而誠實的塔羅解讀者。請根據以下抽牌結果，寫一段解讀給問卜的人看。');
  L.push('');
  L.push('【問題】' + (fullQuestion() || '（沒有特定問題，想看整體狀態）'));
  L.push('【牌陣】' + spread.name + ' —— ' + spread.desc);
  L.push('【抽到的牌與牌義（只能依據這些，不可以自己發明牌義）】');
  L.push(cards);
  L.push('【牌面整體判定】' + sum.label + '　' + sum.text);
  L.push('');
  L.push('【要求】');
  L.push('1. 先用兩三句把每張牌在它的位置上代表什麼講清楚，再把牌湊起來針對問題給一個明確的答案。');
  L.push('2. 誠實。判定偏逆就直說不順，但一定要給出可以做的事，不要只是安慰。');
  L.push('3. 語氣溫暖口語，像朋友在講話。不要用「親愛的」「宇宙正在」這類浮誇字眼。');
  L.push('4. 不要提供醫療、法律、投資的具體建議，也不要預言生死或疾病。');
  L.push('5. 繁體中文，400～600 字，直接輸出內容，不要開場白也不要標題。');
  return L.join('\n');
}

async function fetchDeepReading(sum) {
  if (typeof CLOUD_URL === 'undefined' || !CLOUD_URL) return;
  $('deepLoading').classList.add('show');
  const giveUp = setTimeout(() => $('deepLoading').classList.remove('show'), 12000);
  try {
    const res = await fetch(CLOUD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'reading', key: CLOUD_WRITE_KEY, visitor: visitorId(), prompt: buildVisitorPrompt(sum) }),
    });
    const j = await res.json();
    if (j && j.ok && j.text) {
      $('deepBody').textContent = j.text.trim();
      $('deepBox').classList.add('show');
    }
  } catch (e) { /* 完全靜默 */ }
  clearTimeout(giveUp);
  $('deepLoading').classList.remove('show');
}

// ===== 神諭卡（只能抽一次，避免變成「再抽求好結果」）=====
let curOracle = null;
function resetOracle(verdictTone) {
  curOracle = null;
  $('oracleInvite').style.display = 'block';
  $('oracleCard').classList.remove('show');
  $('oracleQ').textContent = verdictTone === 'neg'
    ? t('oracle_q_neg') : t('oracle_q');
}
$('oracleBtn').addEventListener('click', () => {
  curOracle = drawOracle(3);
  $('oracleList').innerHTML = curOracle.map(o => {
    const x = oracleText(o);
    return `
    <div class="o-item">
      <div class="oi-img"><img src="${oracleImg(o.n)}" alt="${x.title}" loading="lazy"></div>
      <div>
        <div class="oi-title">${o.n}. ${x.title}</div>
        <div class="oi-de">${o.de}</div>
        <div class="oi-msg">${x.msg}</div>
      </div>
    </div>`; }).join('');
  $('oracleInvite').style.display = 'none';
  $('oracleCard').classList.add('show');
  renderTip();
  flushLog();     // 神諭卡抽好了，這時候才把「唯一的那一筆」送出去
});

// ===== 紀錄同步 =====
// 一次抽牌只會送出「一筆」。等一下下再送，讓神諭卡有機會一起帶上；
// 使用者提早關掉頁面時，用 sendBeacon 補送。
let logSent = false, logTimer = null, ipPromise = null;

function visitorId() {
  try {
    let v = localStorage.getItem('ml_visitor');
    if (!v) { v = 'V-' + Math.random().toString(36).slice(2, 8).toUpperCase(); localStorage.setItem('ml_visitor', v); }
    return v;
  } catch (e) { return 'V-NOSTORE'; }
}

function fetchIpInfo() {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    setTimeout(() => finish({}), 2500);
    fetch('https://ipapi.co/json/')
      .then(r => r.json())
      .then(j => finish({ ip: j.ip || '', loc: [...new Set([j.city, j.region, j.country_name].filter(Boolean))].join(' ') }))
      .catch(() => finish({}));
  });
}

function buildLogPayload(info) {
  const spread = SPREADS[curSpread];
  return {
    key: CLOUD_WRITE_KEY,
    visitor: visitorId(),
    ip: (info && info.ip) || '',
    loc: (info && info.loc) || '',
    spread: spread.name,
    spreadId: curSpread,
    question: fullQuestion(),
    cards: curDraws.map((d, i) => ({ pos: spread.positions[i], n: d.card.n, name: cardZhName(d.card), up: d.upright })),
    oracle: curOracle ? curOracle.map(o => o.title + '｜' + o.msg).join('　/　') : '',
  };
}

function scheduleLog() {
  if (typeof CLOUD_URL === 'undefined' || !CLOUD_URL) return;
  logSent = false;
  clearTimeout(logTimer);
  ipPromise = fetchIpInfo();
  logTimer = setTimeout(flushLog, 12000);   // 12 秒後送；期間抽了神諭卡就提早送
}

async function flushLog() {
  if (logSent || typeof CLOUD_URL === 'undefined' || !CLOUD_URL) return;
  logSent = true;
  clearTimeout(logTimer);
  try {
    const info = await (ipPromise || Promise.resolve({}));
    await fetch(CLOUD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(buildLogPayload(info)),
    });
  } catch (e) { /* 靜默 */ }
}

// 提早離開頁面也要留下紀錄
function beaconLog() {
  if (logSent || typeof CLOUD_URL === 'undefined' || !CLOUD_URL || !curDraws.length) return;
  logSent = true;
  clearTimeout(logTimer);
  try {
    const body = new Blob([JSON.stringify(buildLogPayload(null))], { type: 'text/plain;charset=utf-8' });
    if (navigator.sendBeacon) navigator.sendBeacon(CLOUD_URL, body);
  } catch (e) {}
}
window.addEventListener('pagehide', beaconLog);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') beaconLog(); });

// ===== 贊助區（沒設定連結就完全不出現）=====
function readCount() {
  try {
    const n = parseInt(localStorage.getItem('ml_reads') || '0', 10) + 1;
    localStorage.setItem('ml_reads', String(n));
    return n;
  } catch (e) { return 1; }
}
let myReads = 0;

// 贊助區不是每次都出現：等神諭卡抽過、或她已經回來第三次，才開這個口
// 依語言挑贊助連結：中文給綠界（超商/ATM/LINE Pay），其他語言給 Ko-fi
function tipUrl() {
  if (typeof TIP_URL === 'undefined' || !TIP_URL) return '';
  if (typeof TIP_URL === 'string') return TIP_URL;          // 舊格式也吃得下
  return TIP_URL[LANG] || TIP_URL.en || TIP_URL.zh || '';
}
function renderTip() {
  const url = tipUrl();
  if (!url) { $('tipBox').classList.remove('show'); return; }
  if (!(curOracle || myReads >= 3)) { $('tipBox').classList.remove('show'); return; }
  $('tipMsg').textContent = (LANG === 'zh' && typeof TIP_TEXT !== 'undefined' && TIP_TEXT) ? TIP_TEXT : t('tip_msg');
  $('tipBtn').href = url;
  // 用綠界時把付款方式講出來，很多人是因為沒有 PayPal 才放棄的
  const isEcpay = url.indexOf('ecpay') >= 0;
  $('tipPay').textContent = isEcpay ? t('tip_pay_tw') : '';
  $('tipPay').style.display = isEcpay ? 'block' : 'none';
  $('tipBox').classList.add('show');
}

// ===== 複製文字 =====
$('copyBtn').addEventListener('click', () => {
  const txt = buildShareText(fullQuestion(), SPREADS[curSpread], curDraws, nowStr(), curOracle);
  copyText(txt).then(() => showToast(t('copied')))
    .catch(() => showToast(t('copy_fail')));
});
function copyText(txt) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  return new Promise((res, rej) => {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); }
    document.body.removeChild(ta);
  });
}

// ===== 牌面圖：優先複製到剪貼簿，不支援才下載 =====
function loadImg(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
}

async function renderShareBlob() {
  const spread = SPREADS[curSpread];
  const W = 1080, pad = 64;
  const q = fullQuestion();
  const cv = $('shareCanvas'), g = cv.getContext('2d');
  g.font = '400 32px "DM Sans","PingFang TC",sans-serif';
  const qLines = wrapText(g, q ? '❓ ' + q : '', W - pad * 2);
  const n = curDraws.length, gap = 26;
  const cw = Math.min(200, Math.floor((W - pad * 2 - gap * (n - 1)) / n));
  const ch = Math.round(cw * 1.71);
  const H = 235 + qLines.length * 46 + ch + 130 + 110;
  cv.width = W; cv.height = H;

  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#241d38'); bg.addColorStop(.55, '#2b2340'); bg.addColorStop(1, '#171226');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) {
    g.fillStyle = 'rgba(240,233,219,' + (Math.random() * .5 + .12).toFixed(2) + ')';
    g.beginPath(); g.arc(Math.random() * W, Math.random() * H, Math.random() * 1.6 + .4, 0, 7); g.fill();
  }
  const glow = g.createRadialGradient(W - 130, 110, 10, W - 130, 110, 180);
  glow.addColorStop(0, 'rgba(212,175,106,.5)'); glow.addColorStop(1, 'transparent');
  g.fillStyle = glow; g.fillRect(W - 320, 0, 320, 300);
  g.font = '400 64px serif'; g.fillText('🌙', W - 165, 135);

  g.fillStyle = '#f0e9db';
  g.font = '500 56px "Fraunces",Georgia,serif';
  g.fillText('Moonlight Tarot', pad, 118);
  g.font = '400 28px "DM Sans","PingFang TC",sans-serif';
  g.fillStyle = '#b9a8d6';
  g.fillText((LANG === 'zh' ? '月光塔羅 · ' : '') + spread.name + ' · ' + nowStr(), pad, 168);

  let y = 225;
  g.fillStyle = '#e8dfc9'; g.font = '400 32px "DM Sans","PingFang TC",sans-serif';
  qLines.forEach(l => { g.fillText(l, pad, y); y += 46; });
  y += 18;

  let x = (W - (cw * n + gap * (n - 1))) / 2;
  let imgs = null;
  try { imgs = await Promise.all(curDraws.map(d => loadImg(cardImg(d.card.n)))); } catch (e) { imgs = null; }
  curDraws.forEach((d, i) => {
    g.strokeStyle = '#d4af6a'; g.lineWidth = 3;
    g.strokeRect(x - 4, y - 4, cw + 8, ch + 8);
    if (imgs) {
      g.save();
      if (!d.upright) { g.translate(x + cw / 2, y + ch / 2); g.rotate(Math.PI); g.translate(-(x + cw / 2), -(y + ch / 2)); }
      g.drawImage(imgs[i], x, y, cw, ch);
      g.restore();
    } else {
      g.fillStyle = '#1c1631'; g.fillRect(x, y, cw, ch);
      g.font = '400 64px serif'; g.textAlign = 'center';
      g.fillText(d.card.emoji, x + cw / 2, y + ch / 2 + 20); g.textAlign = 'left';
    }
    g.textAlign = 'center';
    g.fillStyle = '#b9a8d6'; g.font = '500 22px "DM Sans","PingFang TC",sans-serif';
    g.fillText(spread.positions[i], x + cw / 2, y + ch + 44);
    g.fillStyle = '#f0e9db'; g.font = '600 27px "DM Sans","PingFang TC",sans-serif';
    g.fillText(cardZhName(d.card), x + cw / 2, y + ch + 80);
    g.fillStyle = d.upright ? '#9fd8b7' : '#f0a8b0'; g.font = '500 23px "DM Sans","PingFang TC",sans-serif';
    g.fillText(d.upright ? t('upright') : t('reversed'), x + cw / 2, y + ch + 112);
    g.textAlign = 'left';
    x += cw + gap;
  });
  y += ch + 150;
  g.textAlign = 'center';
  g.fillStyle = '#d4af6a'; g.font = '400 26px "DM Sans","PingFang TC",sans-serif';
  g.fillText('✦ Moonlight Tarot · 月光塔羅 ✦', W / 2, y);
  g.textAlign = 'left';

  return new Promise(res => cv.toBlob(res, 'image/png'));
}

function downloadBlob(blob) {
  const a = document.createElement('a');
  a.download = 'moonlight-tarot-' + Date.now() + '.png';
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  showToast(t('img_saved'));
}

$('imgBtn').addEventListener('click', () => {
  const blobPromise = renderShareBlob();
  // Safari 需要在點擊當下就建立 ClipboardItem，所以直接把 Promise 丟進去
  if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
    try {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blobPromise })])
        .then(() => showToast(t('img_copied')))
        .catch(() => blobPromise.then(downloadBlob));
      return;
    } catch (e) { /* 落到下面下載 */ }
  }
  blobPromise.then(downloadBlob);
});

function wrapText(g, text, maxW) {
  if (!text) return [];
  const lines = []; let cur = '';
  for (const ch of text) {
    if (g.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ===== 再抽一次 =====
$('againBtn').addEventListener('click', () => {
  flushLog();                 // 上一次的紀錄先確實送出
  curOracle = null;
  $('resultSection').style.display = 'none';
  $('ritualSection').style.display = 'none';
  $('showResultBtn').style.display = 'none';
  document.querySelectorAll('.setup-panel').forEach(p => p.style.display = 'block');

});

}
document.querySelectorAll('.lang-switch button').forEach(b =>
  b.addEventListener('click', () => setLang(b.dataset.l)));
applyI18n();

renderSpreads();
renderTemplates();
updateStatus();
